name: Fetch site assets

on:
  push:
    branches: [claude/thomas-macedo-landing-page-unuugl]

permissions:
  contents: write

jobs:
  assets:
    if: contains(github.event.head_commit.message, '[fetch-assets]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/thomas-macedo-landing-page-unuugl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download
        run: |
          pip -q install gdown
          python3 .github/shots/assets.py || echo "FALHOU" >> thomas-macedo/img/raw/log.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thomas-macedo/img/raw
          git diff --cached --quiet || git commit -m "Add raw assets (modelos + produtos)"
          git push
