name: Fetch LinkedIn images

on:
  push:
    branches: [claude/thomas-macedo-landing-page-unuugl]

permissions:
  contents: write

jobs:
  linkedin:
    if: contains(github.event.head_commit.message, '[fetch-linkedin]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/thomas-macedo-landing-page-unuugl
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chrome
        run: |
          npm i --no-save playwright@1.55.0
          npx playwright install --with-deps chrome
      - name: Screenshots
        run: |
          mkdir -p geo/linkedin/img
          node .github/shots/linkedin.cjs > geo/linkedin/img/log.txt 2>&1 || echo "FALHOU" >> geo/linkedin/img/log.txt
          cat geo/linkedin/img/log.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geo/linkedin/img
          git diff --cached --quiet || git commit -m "Add LinkedIn images"
          git push
