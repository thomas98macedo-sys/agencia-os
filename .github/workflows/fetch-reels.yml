name: Fetch reels intro from Drive

on:
  push:
    branches: [claude/thomas-macedo-landing-page-unuugl]

permissions:
  contents: write

jobs:
  fetch:
    # roda só quando o commit pedir explicitamente (evita loop)
    if: contains(github.event.head_commit.message, '[fetch-reels]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/thomas-macedo-landing-page-unuugl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          pip -q install gdown
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Download reels from Drive
        run: |
          gdown "https://drive.google.com/uc?id=19DeNQ4yjddNYPM6OCNJEQvxMI-5X_s2g" -O /tmp/reels-src.mp4
          ls -la /tmp/reels-src.mp4
          echo "dimensoes:"; ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 /tmp/reels-src.mp4 || true
      - name: Encode web video + poster
        run: |
          mkdir -p thomas-macedo/vid
          # vídeo otimizado para web: H.264 + AAC, até 1280px no maior lado, faststart
          ffmpeg -y -i /tmp/reels-src.mp4 \
            -vf "scale=w=1280:h=1280:force_original_aspect_ratio=decrease:force_divisible_by=2" \
            -c:v libx264 -crf 25 -preset slow -profile:v high -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart \
            thomas-macedo/vid/reels-thomas.mp4
          # poster a partir de ~1s
          ffmpeg -y -ss 1 -i /tmp/reels-src.mp4 -frames:v 1 \
            -vf "scale=w=1280:h=1280:force_original_aspect_ratio=decrease:force_divisible_by=2" \
            -q:v 3 thomas-macedo/img/reels-poster.jpg
          echo "resultado:"; ls -la thomas-macedo/vid/reels-thomas.mp4 thomas-macedo/img/reels-poster.jpg
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thomas-macedo/vid/reels-thomas.mp4 thomas-macedo/img/reels-poster.jpg
          git diff --cached --quiet || git commit -m "Add reels intro video + poster from Drive"
          git push
