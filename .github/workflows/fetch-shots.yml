name: Screenshot brand sites

on:
  push:
    branches: [claude/thomas-macedo-landing-page-unuugl]

permissions:
  contents: write

jobs:
  shots:
    # roda só quando o commit pedir explicitamente (evita loop)
    if: contains(github.event.head_commit.message, '[fetch-shots]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/thomas-macedo-landing-page-unuugl
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          pip -q install pillow
      - name: Take screenshots
        run: |
          mkdir -p thomas-macedo/img/marcas
          node .github/shots/shots.js > thomas-macedo/img/marcas/shots.log 2>&1 || echo "FALHOU exit=$?" >> thomas-macedo/img/marcas/shots.log
          cat thomas-macedo/img/marcas/shots.log
      - name: Optimize to JPG
        run: |
          python3 - << 'PY'
          from PIL import Image
          import glob, os
          for f in glob.glob('thomas-macedo/img/marcas/*.png'):
              print('otimizando', f)
              im = Image.open(f).convert('RGB')
              im = im.resize((1200, round(im.height * 1200 / im.width)), Image.LANCZOS)
              out = f[:-4] + '.jpg'
              im.save(out, 'JPEG', quality=82, optimize=True, progressive=True)
              os.remove(f)
              print(out, im.size, os.path.getsize(out))
          PY
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thomas-macedo/img/marcas
          git diff --cached --quiet || git commit -m "Add brand site screenshots"
          git push
