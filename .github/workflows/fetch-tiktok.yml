name: Fetch TikTok official assets

on:
  push:
    branches: [claude/thomas-macedo-landing-page-unuugl]

permissions:
  contents: write

jobs:
  tiktok:
    if: contains(github.event.head_commit.message, '[fetch-tiktok]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/thomas-macedo-landing-page-unuugl
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chrome
        run: |
          npm i --no-save playwright@1.55.0
          npx playwright install --with-deps chrome
      - name: Grab TikTok assets
        run: |
          mkdir -p thomas-macedo/img/tiktok/raw
          node .github/shots/tiktok.cjs > thomas-macedo/img/tiktok/raw/log.txt 2>&1 || echo "FALHOU" >> thomas-macedo/img/tiktok/raw/log.txt
          cat thomas-macedo/img/tiktok/raw/log.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thomas-macedo/img/tiktok
          git diff --cached --quiet || git commit -m "Add TikTok official assets"
          git push
