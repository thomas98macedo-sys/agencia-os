name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/thomas-macedo-landing-page-unuugl]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: touch thomas-macedo/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./thomas-macedo
          publish_branch: gh-pages
          cname: www.thomas-macedo.com
