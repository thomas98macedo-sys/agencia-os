<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Painel Eve — Hub de ferramentas da agência" />
<title>Eve — Hub de Ferramentas</title>
<style>
  :root{
    --bg:#0b0e14; --card:#12161f; --card-hover:#181d29; --border:#232a38;
    --txt:#e6e9f0; --muted:#8b93a7; --accent:#7c5cff; --accent-soft:#7c5cff22;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh}
  .wrap{max-width:960px;margin:0 auto;padding:48px 24px}
  header{display:flex;align-items:center;gap:16px;margin-bottom:8px}
  .avatar{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#3b82f6);display:flex;align-items:center;justify-content:center;font-size:26px}
  h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin-bottom:36px;margin-top:6px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:28px 0 14px;display:flex;align-items:center;gap:10px}
  h2::after{content:"";flex:1;height:1px;background:var(--border)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .tool{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;text-decoration:none;color:var(--txt);transition:transform .15s ease,background .15s ease,border-color .15s ease}
  .tool:hover{background:var(--card-hover);border-color:var(--accent);transform:translateY(-2px)}
  .tool .icon{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
  .tool .name{font-weight:600;font-size:15px;line-height:1.3}
  .tool .desc{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.4}
  .empty{color:var(--muted);font-size:13px;padding:18px;border:1px dashed var(--border);border-radius:14px}
  footer{margin-top:48px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar">✦</div>
    <h1>Painel Eve</h1>
  </header>
  <p class="sub">Hub de ferramentas da agência — acesso rápido a tudo que a Eve opera.</p>

  <h2>Ferramentas</h2>
  <div class="grid" id="hub"></div>

  <footer>Eve · AgênciaOS</footer>
</div>

<script>
// ═══ REGISTRO DE FERRAMENTAS DO HUB ═══
// Para adicionar uma nova ferramenta, inclua uma entrada neste array
// seguindo o mesmo padrão: { icon, nome, desc, href }.
const TOOLS = [
  {
    icon: "🎬",
    nome: "Shot List — Gravações",
    desc: "Planejamento de planos e cenas · Hotel Suéter",
    href: "shotlist-hotel-sueter.html",
  },
];

const hub = document.getElementById("hub");
if (!TOOLS.length) {
  hub.innerHTML = '<div class="empty">Nenhuma ferramenta registrada ainda.</div>';
} else {
  hub.innerHTML = TOOLS.map(t => `
    <a class="tool" href="${t.href}">
      <div class="icon">${t.icon}</div>
      <div>
        <div class="name">${t.nome}</div>
        <div class="desc">${t.desc}</div>
      </div>
    </a>`).join("");
}
</script>
</body>
</html>
